name: Backend CI

# The repository root IS the backend (package.json name: "backend"), so this
# workflow must not filter on a `backend/` sub-path: there is none. The previous
# version did, and could therefore never trigger — see the git history of this
# file for the commit that introduced it against a layout that did not exist.
on:
  push:
    branches: [main]
  pull_request:
    branches: [main]

jobs:
  check:
    name: Lint, tests, audit
    runs-on: ubuntu-latest

    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version-file: '.nvmrc'
          cache: 'npm'
          cache-dependency-path: package-lock.json

      - name: Install dependencies
        run: npm ci

      - name: Lint
        run: npm run lint

      # The Jest suite does not connect to MongoDB; the fixture job below does.
      - name: Test
        run: npm test

      # Blocking again. The 18 findings that forced `continue-on-error` are gone:
      # six transitive bumps plus major upgrades of cloudinary (1 → 2), nodemailer
      # (6 → 9), sharp (0.34 → 0.35) and an override pinning exceljs onto uuid 11.
      # One chain survives — extract-zip, reachable only from the browser-download
      # path this backend never runs — and it is accepted BY NAME in the gate, with
      # its reason and the condition that removes it. Any OTHER high or critical
      # fails the build, which a blanket `--audit-level=high` could no longer do.
      - name: Security audit
        run: npm run audit:ci

  fixture:
    name: Deterministic fixture acceptance checks
    runs-on: ubuntu-latest
    timeout-minutes: 10
    env:
      NODE_ENV: test
      MONGOMS_DOWNLOAD_DIR: ${{ github.workspace }}/.cache/mongodb-binaries
    steps:
      - name: Checkout code
        uses: actions/checkout@v4
      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version-file: '.nvmrc'
          cache: 'npm'
      - name: Cache disposable MongoDB binary
        uses: actions/cache@v4
        with:
          path: .cache/mongodb-binaries
          key: mongodb-${{ runner.os }}-${{ runner.arch }}-${{ hashFiles('package-lock.json') }}
      - name: Install dependencies
        run: npm ci
      - name: Verify fixture and mutation checks on a disposable replica set
        run: npm run seed:test:self-check
